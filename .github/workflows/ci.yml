name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install
          "pydantic>=2.7,<3"
          "srt>=3.5,<4"
          "pytest>=8,<9"
          "PyYAML>=6,<7"

      - name: Check CLI contract
        run: python create-video-knowledge-assets/scripts/vka_cli.py --help

      - name: Run stable offline release tests
        run: python -m pytest -q --ignore-glob="tests/test_qa_*"

  experimental-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    needs: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install
          "pydantic>=2.7,<3"
          "srt>=3.5,<4"
          "pytest>=8,<9"
          "PyYAML>=6,<7"

      - name: Run non-blocking Experimental Q&A tests
        run: python -m pytest -q tests -k "qa_"
